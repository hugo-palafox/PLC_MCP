<!DOCTYPE html>
<html>
<head>
    <title>Industrial Dashboard - Testing_Machine - Preview</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0c0e;
            color: #d8d9da;
            margin: 0;
            padding: 20px;
        }
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #fff;
            margin-bottom: 30px;
        }
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .panel {
            background: #181b1f;
            border: 1px solid #2d3035;
            border-radius: 4px;
            padding: 15px;
            min-height: 150px;
        }
        .panel-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #d8d9da;
        }
        .panel-type {
            font-size: 11px;
            color: #6e7781;
            margin-bottom: 10px;
        }
        .panel-content {
            font-size: 32px;
            font-weight: 300;
            color: #52c41a;
            margin-top: 20px;
        }
        .gauge {
            width: 100%;
            height: 120px;
            background: linear-gradient(90deg, #52c41a 0%, #faad14 50%, #f5222d 100%);
            border-radius: 60px 60px 0 0;
            position: relative;
            margin-top: 20px;
        }
        .gauge::after {
            content: 'OEE';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #6e7781;
        }
        .timeseries {
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, rgba(82, 196, 26, 0.2) 0%, transparent 100%);
            border-bottom: 2px solid #52c41a;
            position: relative;
            margin-top: 20px;
        }
        .timeseries::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #2d3035;
        }
        .stat {
            font-size: 48px;
            font-weight: 200;
            color: #1890ff;
            text-align: center;
            margin-top: 30px;
        }
        .targets {
            background: #0d1117;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 11px;
            color: #6e7781;
        }
        .wide {
            grid-column: span 4;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Industrial Dashboard - Testing_Machine</h1>
        <div class="panel-grid">
<div class="panel ">
  <div class="panel-title">Overall OEE</div>
  <div class="panel-type">Type: gauge</div>
  <div class="gauge"></div>
  <div class="targets">
    <div>Query: Global.fOEE_Overall</div>
  </div>
</div>
<div class="panel ">
  <div class="panel-title">Total Produced</div>
  <div class="panel-type">Type: stat</div>
  <div class="stat">--</div>
  <div class="targets">
    <div>Query: Global.nTotalPartsProduced</div>
  </div>
</div>
<div class="panel ">
  <div class="panel-title">Good Parts</div>
  <div class="panel-type">Type: stat</div>
  <div class="stat">--</div>
  <div class="targets">
    <div>Query: Global.nGoodPartsProduced</div>
  </div>
</div>
<div class="panel wide">
  <div class="panel-title">Production Rate Over Time</div>
  <div class="panel-type">Type: timeseries</div>
  <div class="timeseries"></div>
  <div class="targets">
    <div>Query: rate(Global.nTotalPartsProduced[5m])</div>
  </div>
</div>

        </div>
    </div>
</body>
</html>
